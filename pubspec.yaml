name: toutim
description: "Application de gestion de collections universelles avec moteur de champs dynamiques."
publish_to: "none"
version: 1.0.19+19

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  drift: ^2.23.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Theming
  flex_color_scheme: ^8.1.0
  google_fonts: ^6.2.1

  # Icons
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8

  # Media
  image_picker: ^1.1.2
  image_cropper: ^11.0.0

  # Charts
  fl_chart: ^0.70.2

  # Barcode
  barcode_widget: ^2.0.4
  mobile_scanner: ^6.0.2

  # URL launcher
  url_launcher: ^6.3.1

  # Networking & Storage
  http: ^1.2.0
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.3.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  drift_dev: ^2.23.0

  # App icon generation
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#DAE8F0"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
