name: toutim
description: "Application de gestion de collections universelles avec moteur de champs dynamiques."
publish_to: "none"
version: 1.0.19+19

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^14.8.1

  # Database
  drift: ^2.35.2
  drift_flutter: ^0.3.1

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Theming
  flex_color_scheme: ^8.1.0
  google_fonts: ^6.2.1

  # Icons
  lucide_icons_flutter: ^4.0.0
  cupertino_icons: ^1.0.8

  # Media
  image_picker: ^1.1.2
  image_cropper: ^11.0.0

  # Charts
  fl_chart: ^0.70.2

  # Barcode
  barcode_widget: ^2.0.4
  mobile_scanner: ^6.0.2

  # URL launcher
  url_launcher: ^6.3.1

  # Networking & Storage
  http: ^1.2.0
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.3.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.10.0
  riverpod_generator: ^4.0.9
  freezed: ^4.0.3
  json_serializable: ^6.11.0
  drift_dev: ^2.35.0

  # App icon generation
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#DAE8F0"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
