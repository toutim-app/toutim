name: toutim
description: "Application de gestion de collections universelles avec moteur de champs dynamiques."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  drift: ^2.23.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Theming
  flex_color_scheme: ^8.1.0
  google_fonts: ^6.2.1

  # Icons
  lucide_icons: ^0.257.0

  # Media
  image_picker: ^1.1.2

  # Charts
  fl_chart: ^0.70.2

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  drift_dev: ^2.23.0

flutter:
  uses-material-design: true
